<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Thêm món mới</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-low": "#f3f3f3",
                      "surface-dim": "#dadada",

                      "on-surface-variant": "#59413a",
                      "on-tertiary-fixed-variant": "#005318",
                      "on-primary": "#ffffff",
                      "primary-container": "#ff7043",
                      "secondary": "#765b00",
                      "surface": "#f9f9f9",

                      "secondary-fixed": "#ffdf93",
                      "surface-variant": "#e2e2e2",
                      "on-primary-fixed-variant": "#852300",
                      "primary-fixed": "#ffdbd0",
                      "tertiary": "#126d27",
                      "on-primary-fixed": "#3a0a00",
                      "error": "#ba1a1a",
                      "outline": "#8d7169",
                      "tertiary-fixed": "#9ff79f",
                      "error-container": "#ffdad6",
                      "inverse-surface": "#2f3131",
                      "outline-variant": "#e0bfb6",
                      "tertiary-fixed-dim": "#83da85",
                      "on-tertiary": "#ffffff",
                      "on-primary-container": "#641800",
                      "inverse-on-surface": "#f1f1f1",
                      "surface-bright": "#f9f9f9",
                      "primary": "#ac3509",
                      "on-secondary-fixed-variant": "#594400",
                      "primary-fixed-dim": "#ffb59f",
                      "on-tertiary-fixed": "#002105",
                      "secondary-container": "#fdc825",
                      "inverse-primary": "#ffb59f",
                      "surface-tint": "#ac3509",
                      "surface-container-highest": "#e2e2e2",
                      "on-error-container": "#93000a",
                      "on-tertiary-container": "#003d0f",
                      "surface-container-high": "#e8e8e8",
                      "secondary-fixed-dim": "#f3c01a",
                      "on-background": "#1a1c1c",
                      "surface-container-lowest": "#ffffff",
                      "on-secondary-fixed": "#241a00",
                      "on-surface": "#1a1c1c",
                      "background": "#f9f9f9",
                      "surface-container": "#eeeeee",
                      "on-error": "#ffffff",
                      "on-secondary": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {
                      "xl": "64px",
                      "margin": "48px",
                      "xs": "4px",
                      "md": "24px",
                      "sm": "12px",
                      "lg": "40px",
                      "base": "8px",
                      "gutter": "24px"
              },
              "fontFamily": {
                      "body-lg": [
                              "Plus Jakarta Sans"
                      ],
                      "display-lg": [
                              "Plus Jakarta Sans"
                      ],
                      "headline-lg": [
                              "Plus Jakarta Sans"
                      ],
                      "headline-md": [
                              "Plus Jakarta Sans"
                      ],
                      "body-md": [

                      ],
                      "label-md": [

                      ]
              },
              "fontSize": {
                      "body-lg": [
                              "18px",

                      "display-lg": [

                      ],
                      "headline-lg": [

                                      "fontWeight": "700"

                      ],
                      "body-md": [
                              "16px",
                              {

                                      "fontWeight": "400"

                      ],
                      "label-md": [
                              "14px",
                              {
                                      "lineHeight": "1.0",
                                      "letterSpacing": "0.01em",

                      ]
              }
      },
          },
        }
    </script>
</head>
<body class="bg-background text-on-background font-body-md h-screen w-full overflow-hidden flex">
<!-- SideNavBar (Suppressed due to Task-Focused Intent: Add New Food) -->
<!-- Main Content Canvas -->
<main class="flex-1 h-full overflow-y-auto px-md py-xl md:px-xl md:py-xl flex flex-col items-center justify-center">
<div class="w-full max-w-2xl">
<!-- Header -->
<div class="mb-lg text-center">
<span class="material-symbols-outlined text-primary text-5xl mb-sm" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<h1 class="font-headline-lg text-headline-lg text-on-background mb-xs">Thêm món mới</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Lưu lại những món ngon để lần sau đỡ phải nghĩ!</p>
</div>
<!-- Form Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_20px_40px_rgba(172,53,9,0.05)] p-lg border border-outline-variant/30">
<form class="flex flex-col gap-md">
<!-- Tên món/quán -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface" for="foodName">Tên món/quán *</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">restaurant</span>
<input class="w-full bg-surface-container-low border-none rounded-full py-sm pl-[44px] pr-sm font-body-md text-body-md text-on-background placeholder:text-on-surface-variant focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all shadow-inner" id="foodName" placeholder="VD: Bún chả Hương Liên, Phở Thìn..." type="text"/>
</div>
</div>
<!-- Image Upload Placeholder -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface">Hình ảnh (Tuỳ chọn)</label>
<div class="h-32 w-full bg-surface-container-low rounded-DEFAULT border-2 border-dashed border-outline-variant flex flex-col items-center justify-center gap-base cursor-pointer hover:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-3xl">add_a_photo</span>
<span class="font-label-md text-label-md text-on-surface-variant">Tải ảnh lên</span>
</div>
</div>
<!-- Giá -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface">Mức giá</label>
<div class="flex gap-sm flex-wrap">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="price" type="radio" value="cheap"/>
<div class="px-md py-sm rounded-full border border-outline-variant text-on-surface-variant peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-secondary-container peer-checked:font-bold transition-all font-body-md text-body-md flex items-center gap-xs">
<span class="material-symbols-outlined text-sm">savings</span>
                                    Rẻ
                                </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="price" type="radio" value="medium"/>
<div class="px-md py-sm rounded-full border border-outline-variant text-on-surface-variant peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-secondary-container peer-checked:font-bold transition-all font-body-md text-body-md flex items-center gap-xs">
<span class="material-symbols-outlined text-sm">payments</span>
                                    Vừa
                                </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="price" type="radio" value="expensive"/>
<div class="px-md py-sm rounded-full border border-outline-variant text-on-surface-variant peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-secondary-container peer-checked:font-bold transition-all font-body-md text-body-md flex items-center gap-xs">
<span class="material-symbols-outlined text-sm">diamond</span>
                                    Sang chảnh
                                </div>
</label>
</div>
</div>
<!-- Tags -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface">Tags (Đặc điểm)</label>
<div class="flex gap-sm flex-wrap">
<label class="cursor-pointer">
<input class="peer sr-only" name="tags" type="checkbox" value="fast"/>
<div class="px-md py-sm rounded-full border border-outline-variant bg-surface-container text-on-surface-variant peer-checked:bg-tertiary-container peer-checked:text-on-tertiary-container peer-checked:border-tertiary-container peer-checked:font-bold transition-all font-body-md text-body-md flex items-center gap-xs">
<span class="material-symbols-outlined text-sm">timer</span>
                                    Ăn nhanh
                                </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="tags" type="checkbox" value="near"/>
<div class="px-md py-sm rounded-full border border-outline-variant bg-surface-container text-on-surface-variant peer-checked:bg-tertiary-container peer-checked:text-on-tertiary-container peer-checked:border-tertiary-container peer-checked:font-bold transition-all font-body-md text-body-md flex items-center gap-xs">
<span class="material-symbols-outlined text-sm">location_on</span>
                                    Gần
                                </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="tags" type="checkbox" value="solo"/>
<div class="px-md py-sm rounded-full border border-outline-variant bg-surface-container text-on-surface-variant peer-checked:bg-tertiary-container peer-checked:text-on-tertiary-container peer-checked:border-tertiary-container peer-checked:font-bold transition-all font-body-md text-body-md flex items-center gap-xs">
<span class="material-symbols-outlined text-sm">person</span>
                                    Một mình
                                </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="tags" type="checkbox" value="group"/>
<div class="px-md py-sm rounded-full border border-outline-variant bg-surface-container text-on-surface-variant peer-checked:bg-tertiary-container peer-checked:text-on-tertiary-container peer-checked:border-tertiary-container peer-checked:font-bold transition-all font-body-md text-body-md flex items-center gap-xs">
<span class="material-symbols-outlined text-sm">groups</span>
                                    Nhóm
                                </div>
</label>
</div>
</div>
<hr class="border-outline-variant/30 my-sm"/>
<!-- Actions -->
<div class="flex gap-md justify-end mt-sm">
<button class="px-lg py-sm rounded-full font-label-md text-label-md text-primary bg-surface-container-low hover:bg-surface-variant/50 transition-colors" type="button">
                            Hủy
                        </button>
<button class="px-lg py-sm rounded-full font-label-md text-label-md text-on-primary bg-primary hover:scale-[0.98] hover:shadow-md transition-all flex items-center gap-xs" type="submit">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">save</span>
                            Lưu món này
                        </button>
</div>
</form>
</div>
</div>
</main>
</body></html>
